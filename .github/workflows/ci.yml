name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Target CI -Configuration Release

  package:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install Inno Setup 7
        # chocolatey still ships 6.x, which lacks the SetupArchitecture directive
        # the installer script uses; install the pinned stable from the official
        # immutable GitHub release (see files.jrsoftware.org/is/7/readme.txt).
        shell: powershell
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/ALLUSERS"
          # The runner image preinstalls Inno Setup 6 on PATH; point build.ps1
          # at the freshly installed 7 explicitly.
          $iscc = "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 7 not found at $iscc" }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Generate ephemeral signing key
        # Package refuses unsigned payloads; CI signs with a throwaway key.
        # Real releases are built locally with the private texshift_key.snk.
        shell: powershell
        run: |
          $rsa = New-Object System.Security.Cryptography.RSACryptoServiceProvider 2048
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\ci.snk", $rsa.ExportCspBlob($true))
          "TEXSHIFT_SIGNING_KEY_PATH=$env:RUNNER_TEMP\ci.snk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer (smoke)
        shell: powershell
        run: ./build.ps1 -Target Package -Configuration Release -Version 0.0.0
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: TeXShift-installer
          path: artifacts/package/*.exe
          retention-days: 7
